# Pages CMS settings: lets Siren Glam edit nail sets and reviews at app.pagescms.org
media:
  input: images
  output: /images
  categories: [image]
  rename: safe

content:
  - name: products
    label: Nail sets
    type: file
    path: content/products.json
    format: json
    list: true
    fields:
      - name: name
        label: Set name
        type: string
        required: true
      - name: price
        label: Price (KSh)
        type: number
        required: true
        options:
          min: 0
      - name: image
        label: Photo
        type: image
        required: true
        description: A clear photo of the nails. Square or portrait photos look best.
      - name: shade
        label: Colour / finish
        type: string
        description: e.g. Glossy cherry red
      - name: shape
        label: Shape
        type: string
        description: e.g. Almond, Square, Squoval, Stiletto, Coffin
      - name: tag
        label: Badge (optional)
        type: string
        description: Small label on the photo, e.g. Bestseller, New or Limited. Leave empty for none.
      - name: description
        label: Description
        type: text
        description: Shown when a customer taps "View full details".
      - name: featured
        label: Feature this set
        type: boolean
        description: Tick to show this set first in the shop and often in the photos at the top of the page.
      - name: was_price
        label: Was price (KSh, optional)
        type: number
        description: For a sale. Enter the old price here and the sale price in "Price". The card shows the old price crossed out. Leave empty when there is no sale.
        options:
          min: 0
      - name: sold_out
        label: Sold out
        type: boolean
        description: Tick when this set is out of stock. It stays on the website, greyed out with a "Sold out" badge, and the button asks you on WhatsApp when it's back.
      - name: hide
        label: Hide from website
        type: boolean
        description: Tick to remove this set from the website completely, without deleting it.

  - name: reviews
    label: Customer reviews
    type: file
    path: content/reviews.json
    format: json
    list: true
    fields:
      - name: quote
        label: What the customer said
        type: text
        required: true
      - name: name
        label: Customer first name
        type: string
      - name: area
        label: Area
        type: string
        description: e.g. Kilimani
      - name: set
        label: Nail set they bought (optional)
        type: string
      - name: stars
        label: Stars (1-5)
        type: number
        options:
          min: 1
          max: 5
          step: 1
      - name: photo
        label: Customer photo (optional)
        type: image
        description: Only use a customer's photo with their permission.
      - name: hide
        label: Hide from website
        type: boolean

  - name: site
    label: Site photos, links & announcement
    type: file
    path: content/site.json
    format: json
    fields:
      - name: announcement_on
        label: Show announcement bar
        type: boolean
        description: Tick to show a strip across the very top of the website.
      - name: announcement
        label: Announcement text
        type: string
        description: One short line, e.g. Free delivery in Nairobi this weekend
      - name: announcement_link
        label: Announcement link (optional)
        type: string
        description: Where tapping the bar goes, e.g. #shop for the sets, or a full https:// link. Leave empty for no link.
      - name: instagram
        label: Instagram (optional)
        type: string
        description: Your Instagram @handle or full link, e.g. @sirenglam.ke. Leave empty to hide.
      - name: tiktok
        label: TikTok (optional)
        type: string
        description: Your TikTok @handle or full link. Leave empty to hide.
      - name: facebook
        label: Facebook (optional)
        type: string
        description: Your Facebook page name or full link. Leave empty to hide.
      - name: logo
        label: Logo
        type: image
        description: Shown in the header, on the round badge at the top and in the footer. A square image works best.
      - name: sizing_photo
        label: Sizing section photo
        type: image
        description: The photo beside "Not sure about your size?".
      - name: gallery_large
        label: "Why press-ons: large photo"
        type: image
        description: The tall photo on the left of the "Salon nails, on your schedule" section.
      - name: gallery_top
        label: "Why press-ons: top small photo"
        type: image
      - name: gallery_bottom
        label: "Why press-ons: bottom small photo"
        type: image

  - name: delivery
    label: Delivery info
    type: file
    path: content/delivery.json
    format: json
    list: true
    fields:
      - name: title
        label: Heading
        type: string
        required: true
        description: e.g. Delivery fee
      - name: text
        label: Details
        type: text
        required: true
        description: e.g. KSh 200 within Nairobi CBD, KSh 300 elsewhere in Nairobi.
      - name: hide
        label: Hide from website
        type: boolean

  - name: faq
    label: FAQs
    type: file
    path: content/faq.json
    format: json
    list: true
    fields:
      - name: question
        label: Question
        type: string
        required: true
        description: e.g. Do you do custom designs?
      - name: answer
        label: Answer
        type: text
        required: true
      - name: hide
        label: Hide from website
        type: boolean
